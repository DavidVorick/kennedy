[workspace]
members = [
    "KennedyServer",
    "data/kcode/kcode-rust-libs/kcode-dev-tools-chatend/generations/g-74b-18c77ed5ae02cec0-0",
    "data/kcode/kcode-rust-libs/kcode-session-history/generations/g-499a-18c76391cdc01638-0",
    "data/kcode/kcode-rust-libs/kcode-telegram-identity/generations/g-4ed1-18c70c4992c16252-0",
    "data/kcode/kcode-rust-libs/kcode-tg-kennedy-bot/generations/g-433-18c77f50b5cecaba-0",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
http = "1"
kcode-codex-runtime = "0.1.0"
kcode-codex-runtime-v2 = "0.1.2"
kcode-commit-session = "=0.1.0"
kcode-credential-vault = "=0.1.0"
kcode-history-ingress-context = "=0.1.0"
kcode-kweb-context = "=0.2.0"
kcode-kweb-db = "1.0"
kcode-kmap = { path = "data/kcode/kcode-rust-libs/kcode-kmap/generations/g-4d7f-18c763db68f4642d-0" }
kcode-kmap-size = "=0.1.0"
kcode-server-object-envelopes = "=0.1.0"
kcode-tg-kennedy-bot = "=0.4.0"
kcode-audio-ingress = "0.5.2"
# Exact because this crate is directly entrusted with the crates.io publication token.
kcode-dev-tools = "=0.4.2"
kcode-dev-tools-chatend = "0.1.0"
kcode-session-history = "=0.1.2"
kcode-speech-classification = "=0.1.2"
kcode-telegram-identity = "=0.1.2"
kcode-agent-runtime = "=0.1.1"
kcode-audio-session-ingress = "=0.2.0"
kcode-intelligence-router = "=0.2.1"
kcode-web-semver-routing = "0.2.0"
rand = "0.9"
rpassword = "7.5.4"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "multipart", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"
futures = "0.3"
hound = "3.5"

[patch.crates-io]
kcode-agent-runtime = { path = "data/kcode/kcode-rust-libs/kcode-agent-runtime/generations/g-23f3-18c6a0bd004a0de5-6" }
