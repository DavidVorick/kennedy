[workspace]
members = [
    "KennedyServer",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
http = "1"
kcode-agent-runtime = "0.2.2"
kcode-audio-ingress = "0.5.3"
kcode-audio-session-ingress = "0.2.1"
kcode-codex-runtime = "0.1.1"
kcode-codex-runtime-v2 = "0.1.3"
kcode-commit-session = "0.1.1"
# Exact because the vault is directly entrusted with reusable credentials.
kcode-credential-vault = "=0.1.0"
# Exact because this crate is directly entrusted with the crates.io publication token.
kcode-dev-tools = "=0.4.3"
kcode-dev-tools-chatend = "0.1.1"
kcode-history-ingress-context = "0.1.1"
kcode-http-api = "0.1.0"
kcode-intelligence-chatend = "0.1.0"
kcode-intelligence-router = "0.2.3"
# Exact because the application composition root is entrusted with reusable credentials.
kcode-kennedy-app = "=0.1.0"
kcode-kennedy-sessions = "0.1.0"
kcode-kmap-size = "0.1.0"
kcode-kweb-context = "0.2.1"
kcode-kweb-db = "1.0.4"
kcode-kweb-manager = "0.1.1"
kcode-server-object-envelopes = "0.1.0"
kcode-session-history = "0.1.3"
kcode-speech-classification = "0.1.2"
# Exact because this crate owns durable identity authorization state.
kcode-telegram-identity = "=0.1.5"
kcode-telegram-session-coordinator = "0.1.0"
# Exact because this transport is directly entrusted with the Telegram bot token.
kcode-tg-kennedy-bot = "=0.5.1"
rand = "0.9"
rpassword = "7.5.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"
futures = "0.3"
hound = "3.5"

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[patch.crates-io]
kcode-agent-runtime = { path = "data/kcode/kcode-rust-libs/kcode-agent-runtime/generations/g-f67d-18c7d6e12139804b-0" }
kcode-kennedy-roots = { path = "data/kcode/kcode-rust-libs/kcode-kennedy-roots/generations/g-9e25-18c7d84abead2918-0" }
kcode-kennedy-orchestration = { path = "data/kcode/kcode-rust-libs/kcode-kennedy-orchestration/generations/g-9d68-18c7d82fe4ac32c8-0" }
kcode-kennedy-telegram-runtime = { path = "data/kcode/kcode-rust-libs/kcode-kennedy-telegram-runtime/generations/g-b796-18c7d85f7c53e227-0" }
kcode-kennedy-app = { path = "data/kcode/kcode-rust-libs/kcode-kennedy-app/generations/g-bbc9-18c7d878ce219be2-0" }
