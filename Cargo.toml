[workspace]
members = ["AudioIngress", "ConversationHistory", "KennedyServer"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
age = "0.12.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = "1"
hex = "0.4"
http = "1"
kcode-codex-runtime = "0.1.0"
kcode-codex-runtime-v2 = "0.1.1"
kcode-doc-extraction = "0.1.0"
kcode-gemini-api = "=0.1.1"
kcode-kweb-db = "1.0"
kcode-audio-transcribe = "0.1.0"
kcode-openai-api = "=0.1.0"
kcode-rust-libs-v2 = "=1.1.0"
kcode-session-log = "0.2.1"
kcode-web-fetch = "0.1.1"
rand = "0.9"
rpassword = "7.5.4"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "multipart", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"
futures = "0.3"
hound = "3.5"

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
