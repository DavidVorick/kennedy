[workspace]
members = [
    "KennedyServer",
    "tools/kcode-publisher",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# This bootstrap workspace deliberately follows the highest published application release.
kcode-kennedy-app = "*"

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
