[package]
name = "kennedy-telegram-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A host-integrated Telegram transport, durable queue, and fail-closed group-security library"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
futures = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.17", default-features = false, features = ["rustls", "rustls-native-roots", "tracing"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
