[package]
name = "kcode-audio-transcribe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "In-memory asynchronous audio transcription with Gemini and Codex reconciliation"
documentation = "https://docs.rs/kcode-audio-transcribe"
readme = "README.md"
keywords = ["audio", "transcription", "gemini", "codex"]
categories = ["multimedia::audio", "api-bindings"]
include = [
    "src/**",
    "Cargo.toml",
    "DependencyAudit.md",
    "Documentation.md",
    "LICENSE",
    "README.md",
    "Specification.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "kcode_audio_transcribe"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
hound = "3.5"
kcode-codex-runtime = "0.1.0"
kcode-gemini-api = "=0.1.0"
ruopus = { version = "0.1.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
