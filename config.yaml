# Kennedy's tracked, non-secret runtime configuration. Credential values live
# only in the passphrase-encrypted vault referenced below.
credentials:
  vault_path: ./kennedy-secrets.age

server:
  bind: 127.0.0.1:4322
  max_request_bytes: 27262976
  allowed_origins:
    - http://127.0.0.1:4321

web:
  search_context_size: high
  search_reasoning_effort: xhigh
  max_search_sources: 12
  search_timeout_seconds: 600
  fetch_timeout_seconds: 30
  max_fetch_bytes: 2000000
  max_fetch_characters: 50000
  max_redirects: 5

audio:
  # Generic vault name used only by the trusted transcription connector.
  api_key_secret: openai-api-key
  api_base: https://api.openai.com/v1/
  transcription_model: gpt-4o-transcribe
  transcription_prompt: "Transcribe faithfully. When discernible and relevant, include non-speech sounds, speaker changes, tone, pauses, music, and background audio in concise brackets."
  timeout_seconds: 120
  max_upload_bytes: 26214400

telegram:
  # Generic vault name used only by the trusted Telegram connector.
  bot_token_secret: telegram-bot-token

default_provider: primary

providers:
  primary:
    kind: codex
    executable: codex-safe
    working_directory: /tmp
    default_model: gpt-5.6-sol
    models:
      - gpt-5.6-sol
    reasoning_effort: xhigh
    context_window_tokens: 1050000
    max_input_tokens: 922000
    native_audio_input_models: []
    timeout_seconds: 600
