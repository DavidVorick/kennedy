[package]
name = "kcode-tg-kennedy-bot"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "A host-integrated Telegram transport, durable queue, and fail-closed group-security library"
documentation = "https://docs.rs/kcode-tg-kennedy-bot"
readme = "README.md"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["multipart"] }
chrono = "=0.4.45"
futures = "=0.3.33"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
teloxide = { version = "=0.17.0", default-features = false, features = ["rustls", "rustls-native-roots", "tracing"] }
tokio = { version = "=1.53.1", features = ["full"] }
tower-http = { version = "=0.7.0", features = ["cors", "trace"] }
tracing = "=0.1.44"
uuid = { version = "=1.24.0", features = ["v4"] }
zeroize = "=1.9.0"
