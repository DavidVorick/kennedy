server:
  bind: 127.0.0.1:4322
  max_request_bytes: 10485760
  allowed_origins:
    - http://127.0.0.1:4321

web:
  search_context_size: high
  search_reasoning_effort: high
  max_search_sources: 12
  search_timeout_seconds: 600
  search_poll_interval_milliseconds: 1000
  fetch_timeout_seconds: 30
  max_fetch_bytes: 2000000
  max_fetch_characters: 50000
  max_redirects: 5

default_provider: primary

providers:
  primary:
    kind: openai
    api_key: "replace-with-your-openai-api-key"
    base_url: https://api.openai.com/v1
    default_model: gpt-5.6-sol
    models:
      - gpt-5.6-sol
    reasoning_effort: xhigh
    context_window_tokens: 1050000
    max_input_tokens: 922000
    # Per-HTTP-operation deadline. Background jobs have their own total deadline below.
    timeout_seconds: 120
    response_timeout_seconds: 600
    response_poll_interval_milliseconds: 1000
