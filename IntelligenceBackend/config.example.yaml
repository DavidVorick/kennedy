server:
  bind: 127.0.0.1:4322
  max_request_bytes: 10485760
  allowed_origins:
    - http://127.0.0.1:4321

default_provider: primary

providers:
  primary:
    kind: openai
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    default_model: gpt-5.5
    models:
      - gpt-5.5
    timeout_seconds: 120

