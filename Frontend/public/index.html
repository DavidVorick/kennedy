<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kennedy</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260712.1">
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">LOCAL MEMORY ASSISTANT</span>
      <h1>Kennedy</h1>
    </div>
    <div class="top-actions">
      <span id="service-status" class="status" role="status">Starting…</span>
      <button id="chat-tab" class="tab active" type="button">Conversation</button>
      <button id="memory-tab" class="tab" type="button">Memory</button>
    </div>
  </header>

  <main>
    <section id="chat-view" class="workspace">
      <section class="panel conversation-panel" aria-label="Conversation">
        <div id="transcript" class="transcript" aria-live="polite">
          <div class="empty-state">
            <p class="empty-title">What are we working on?</p>
            <p>Kennedy can help directly and draw on your local memory when it matters.</p>
          </div>
        </div>
        <section id="ingress-panel" class="ingress-panel hidden" aria-label="History ingress activity">
          <div class="ingress-heading">
            <div><span class="eyebrow">MEMORY UPDATE</span><strong id="ingress-title">History ingress</strong></div>
            <button id="dismiss-ingress" class="quiet" type="button">Dismiss</button>
          </div>
          <div id="ingress-log" class="ingress-log" aria-live="polite"></div>
        </section>
        <div id="error-banner" class="error-banner hidden" role="alert"></div>
        <form id="message-form" class="composer">
          <label class="sr-only" for="message-input">Message Kennedy</label>
          <textarea id="message-input" rows="3" placeholder="Message Kennedy…" required></textarea>
          <div class="composer-actions">
            <button id="end-button" class="secondary" type="button">End conversation</button>
            <span id="activity" class="activity" aria-live="polite"></span>
            <button id="send-button" class="primary" type="submit">Send</button>
          </div>
        </form>
      </section>

      <aside class="panel inspector-panel" aria-label="Kennedy context inspector">
        <div class="panel-heading">
          <div><span class="eyebrow">KENNEDY'S CURRENT CONTEXT</span><h2>Chatend</h2></div>
          <div class="inspector-heading-actions">
            <div id="usage-metrics" class="context-usage" aria-label="Token and cache usage"></div>
            <button id="copy-context" class="quiet" type="button">Copy view</button>
          </div>
        </div>
        <nav class="inspector-tabs" aria-label="Chatend views">
          <button id="inspector-full" class="inspector-tab active" type="button" aria-pressed="true">Full view</button>
          <button id="inspector-system" class="inspector-tab" type="button" aria-pressed="false">System prompts</button>
          <button id="inspector-memory" class="inspector-tab" type="button" aria-pressed="false">Memory tree</button>
        </nav>
        <div id="context-inspector" class="inspector-content" tabindex="0"></div>
      </aside>
    </section>

    <section id="memory-view" class="memory-view hidden" aria-label="Memory explorer">
      <div class="memory-toolbar">
        <div>
          <span class="eyebrow">DURABLE KMAP</span>
          <h2>Memory explorer</h2>
        </div>
        <div>
          <button id="memory-back" class="secondary" type="button" disabled>Back</button>
          <button id="memory-forward" class="secondary" type="button" disabled>Forward</button>
          <button id="memory-home" class="secondary" type="button">David’s root</button>
        </div>
      </div>
      <div id="memory-content" class="memory-content"></div>
    </section>
  </main>

  <script type="module" src="/js/app.js?v=20260712.1"></script>
</body>
</html>
